<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="image-cont">
    <img src="assets/leaf.webp" alt="background" id="background-img">
    <div class="bg-text-cont">
      <div class="logo-cont flex-item">
        <img src="assets/odin-lined.png" alt="">
        <p>odin</p>
      </div>
      <div class="image-link-cont flex-item">
        <p>Photo by <a href="">Halie West</a> on <a href="">Unsplash</a></p>
      </div>
    </div>
  </div>
  <div class="text-cont">
    <div class="pre-form-text-cont pl-3 pr-5">
      <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <span>now</span> to get started.</p>
      <p>You <span>know</span> you want to.</p>
    </div>
    <div class="form-cont pl-3">
      <p>Let's do this!</p>
      <div class="form">
        <div class="item-cont">
          <label for="first-name">First name</label>
          <input type="text">
        </div>
        <div class="item-cont">
          <label for="email">Email</label>
          <input type="email">
        </div>
        <div class="item-cont">
          <label for="password">Password</label>
          <input type="password">
        </div>
        <div class="item-cont">
          <label for="last-name">Last name</label>
          <input type="text">
        </div>
        <div class="item-cont">
          <label for="phone">Phone number</label>
          <input type="number">
        </div>
        <div class="item-cont">
          <label for="confirm-password">Confirm password</label>
          <input type="password">
        </div>
      </div>
    </div>
    <div class="btn-cont pl-3">
      <button>Create account</button>
      <p>Already have an account? <a href="">Log in</a></p>
    </div>
  </div>
</body>
</html>
