<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer type="module"></script>
</head>
<body>
  <div class="image-cont">
    <img src="assets/leaf.webp" alt="background" id="background-img">
    <div class="bg-text-cont">
      <div class="logo-cont flex-item">
        <img src="assets/odin-lined.png" alt="">
        <p>odin</p>
      </div>
      <div class="image-link-cont flex-item">
        <p>Photo by <a href="">Halie West</a> on <a href="">Unsplash</a></p>
      </div>
    </div>
  </div>
  <div class="text-cont">
    <div class="pre-form-text-cont pl-3 pr-5">
      <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <span>now</span> to get started.</p>
      <p>You <span>know</span> you want to.</p>
    </div>
    <div class="form-cont pl-3">
      
      <p>Let's do this!</p>
      <form action="#" method="post" id="create-user" novalidate>
        <fieldset>
          <div class="item-cont">
            <label for="first-name">First name *</label>
            <input type="text" name="first-name" id="first-name" validate-required>
            <span></span>
          </div>
          <div class="item-cont">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" validate-email>
            <span></span>
          </div>
          <div class="item-cont">
            <label for="password">Password *</label>
            <input type="password" id="password" validate-required>
            <span></span>
          </div>
        </fieldset>
        <fieldset>
          <div class="item-cont">
            <label for="last-name">Last name *</label>
            <input type="text" name="last-name" id="last-name" validate-required>
            <span></span>
          </div>
          <div class="item-cont">
            <label for="phone">Phone number</label>
            <input type="text" name="phone" id="phone" validate-phone>
            <span></span>
          </div>
          <div class="item-cont">
            <label for="confirm-password">Confirm password *</label>
            <input type="password" name="confirm-password" id="confirm-password" dependant-id='password' validate-required validate-password-match>
            <span></span>
          </div>
        </fieldset>
      </form>
    </div>
    <div class="btn-cont pl-3">
      <button type="submit" form="create-user">Create Account</button>
      <p>Already have an account? <a href="">Log in</a></p>
    </div>
  </div>
</body>
</html>
